# =============================================================================
# SolarGuard -- Nginx Site Configuration for Ubuntu ARM64 (Oracle Cloud)
# Reverse Proxy, Static File Acceleration & Strict Media Privacy
# =============================================================================

upstream solarguard_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your Oracle VM Public IP or domain name
    server_name _;

    # Maximum payload size for high-resolution solar panel photos
    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/solarguard_access.log;
    error_log /var/log/nginx/solarguard_error.log;

    # -------------------------------------------------------------------------
    # Static Assets (CSS, JS, Fonts, Brand SVGs)
    # -------------------------------------------------------------------------
    location /static/ {
        alias /var/www/solarguard/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Private Media Security (CRITICAL RBAC PROTECTION)
    # Direct access to /media/ is strictly forbidden to prevent unauthorized
    # download of customer solar panel photographs.
    # Images must be accessed through /inspect/result/<id>/image/ or
    # /issues/<id>/photo/ which enforce user ownership.
    # -------------------------------------------------------------------------
    location /media/ {
        return 403 "Access Denied: Direct media browsing is disabled. Access photos via authorized inspection reports.";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Application Reverse Proxy (Gunicorn WSGI)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://solarguard_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Generous timeouts for MobileNetV2 CNN inference on large images
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        
        proxy_redirect off;
    }
}
